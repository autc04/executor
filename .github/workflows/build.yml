name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build bison ruby perl \
            libboost-all-dev qt6-base-dev libsdl2-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build -LE xfail --no-compress-output -T test --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: build/Testing/

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install prerequisites
        run: brew install boost qt@6 ninja bison ruby

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBISON_COMMAND="$(brew --prefix bison)/bin/bison" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)/lib/cmake"

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build -LE xfail --no-compress-output -T test --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: build/Testing/

  windows-clang:
    name: Windows (clang-cl)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Bison
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: bison

      - name: Add Bison to PATH
        shell: pwsh
        run: echo "C:\msys64\usr\bin" >> $env:GITHUB_PATH

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Boost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # Build only the compiled Boost libraries Executor links, as static
          # libraries, with the same clang-cl toolchain as the rest of the build.
          # Boost's CMake build installs BoostConfig.cmake, which is what
          # find_package(Boost CONFIG) consumes.  Extract the archive ourselves
          # with Expand-Archive so this does not depend on which 'tar' the
          # MSYS2 setup action put on PATH.
          $Url = "https://archives.boost.io/release/1.90.0/source/boost_1_90_0.zip"
          $Archive = "$env:RUNNER_TEMP\boost_1_90_0.zip"
          $Source = "$env:RUNNER_TEMP\boost_1_90_0"
          $Build = "$env:RUNNER_TEMP\boost-build"
          Invoke-WebRequest -Uri $Url -OutFile $Archive
          Expand-Archive -Path $Archive -DestinationPath $env:RUNNER_TEMP -Force
          if (-not (Test-Path "$Source\CMakeLists.txt")) {
            throw "Boost source not found at $Source"
          }

          $Libs = "filesystem;program_options;json"
          cmake -S $Source -B $Build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DBUILD_SHARED_LIBS=OFF `
            "-DBOOST_INCLUDE_LIBRARIES=$Libs" `
            -DBUILD_TESTING=OFF `
            -DCMAKE_INSTALL_PREFIX=C:\boost
          if ($LASTEXITCODE -ne 0) { throw "Boost configure failed" }
          cmake --build "$Build" --target install
          if ($LASTEXITCODE -ne 0) { throw "Boost build failed" }

      - name: Show compiler versions
        shell: pwsh
        run: clang-cl --version

      - name: Configure
        shell: pwsh
        run: |
          # Boost's CMake install writes BoostConfig.cmake to lib/cmake/Boost-<version>.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR\lib\cmake" `
            -DBoost_DIR=C:\boost\lib\cmake\Boost-1.90.0 `
            -DBISON_COMMAND=C:\msys64\usr\bin\bison.exe

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -LE xfail --no-compress-output -T test --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-clang
          path: build/Testing/


  windows-msvc:
    name: Windows (msvc)
    if: false
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Bison
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: bison

      - name: Add Bison to PATH
        shell: pwsh
        run: echo "C:\msys64\usr\bin" >> $env:GITHUB_PATH

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64

      - name: Install Boost
        shell: pwsh
        run: |
          $Url = "https://archives.boost.io/release/1.90.0/binaries/boost_1_90_0-msvc-14.3-64.exe"
          (New-Object System.Net.WebClient).DownloadFile($Url, "$env:RUNNER_TEMP\boost.exe")
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\boost.exe" -ArgumentList "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\boost"
          # Start-Process does not report the installer's exit code, so verify the result.
          if (-not (Test-Path C:\boost\lib64-msvc-14.3\cmake\Boost-1.90.0\BoostConfig.cmake)) {
            throw "Boost install incomplete: no BoostConfig.cmake in C:\boost"
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          # The installer's CMake configs live in lib64-msvc-<toolset>\cmake, whose
          # directory name is not one of the lib* directories find_package searches,
          # so point Boost_DIR at the package directory itself.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR\lib\cmake" `
            -DBoost_DIR=C:\boost\lib64-msvc-14.3\cmake\Boost-1.90.0 `
            -DBISON_COMMAND=C:\msys64\usr\bin\bison.exe

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -LE xfail --no-compress-output -T test --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-msvc
          path: build/Testing/

  nix:
    name: Nix ${{ matrix.package }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
        package:
          - default
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          # flake sources only include submodule contents when checked out recursively
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: autc04
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build .#${{ matrix.package }}
        run: nix build .#${{ matrix.package }} --print-build-logs

  nix-windows:
    name: Nix cross-build .#windows (Linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: autc04
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build .#windows
        run: nix build .#windows --print-build-logs
